[project]
name = "python-tests-example"
version = "0.1.0"
description = "Automated API + UI test suite for the Restful Booker Platform demo."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "faker>=30.0",
    "allure-pytest>=2.13",
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--alluredir=allure-results --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure"
markers = [
    "api: API tests against the Restful Booker Platform REST API",
    "ui: UI tests against the Restful Booker Platform website (Playwright)",
    "canary: deliberately-failing test that exercises the AI failure-analysis pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# allure-pytest ships no type annotations/stubs. Rather than sprinkling
# `# type: ignore[no-untyped-call]` on every `allure.feature(...)`/
# `allure.step(...)` call site, treat the package as untyped (like a module
# with genuinely missing stubs) so calls into it aren't flagged under strict
# mode - our own code is still fully strict-checked.
[[tool.mypy.overrides]]
module = ["allure", "allure.*", "allure_commons.*", "allure_pytest.*"]
follow_imports = "skip"
